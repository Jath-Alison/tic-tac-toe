[project]
name = "tic-tac-toe"
version = "0.1.0"
description = "Learn reinforcement learning with tic-tac-toe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pettingzoo[classic]==1.25.0", "numpy>=1.24"]

[project.scripts]
tic-tac-toe = "tic_tac_toe.play:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
